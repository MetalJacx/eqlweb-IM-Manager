name: Update Item Database Export

on:
  schedule:
    - cron: "17 6 * * *" # once daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    if: ${{ vars.ITEM_DB_API_BASE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch export from the item database Worker
        env:
          API_BASE: ${{ vars.ITEM_DB_API_BASE }}
          EXPORT_TOKEN: ${{ secrets.ITEM_DB_EXPORT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p frontend/data
          curl -sf -H "Authorization: Bearer ${EXPORT_TOKEN}" "${API_BASE}/api/export" -o frontend/data/items.json
          jq 'if (.items | type) != "array" then error("malformed export: missing items array") else . end' frontend/data/items.json > /dev/null

      - name: Convert to CSV
        run: |
          set -euo pipefail
          jq -r '
            (["item_id","name","icon_id","confirmations","status","updated_at"] | @csv),
            (.items[] | [.item_id, .name, .icon_id, .confirmations, .status, .updated_at] | @csv)
          ' frontend/data/items.json > frontend/data/items.csv

      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Reset onto the current tip of main *before* diffing/committing,
          # not whatever commit this job's checkout happened to start at.
          # Makes this immune to staleness from a manual "Re-run jobs" (which
          # replays the original checkout) or another push landing mid-run --
          # those previously caused a rejected push or a rebase conflict
          # against a data file that had already changed on main.
          git fetch origin main
          git reset --soft origin/main
          git add frontend/data/items.json frontend/data/items.csv
          if git diff --cached --quiet; then
            echo "No changes to the export."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update item database export"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        # A push made with the default GITHUB_TOKEN (as the step above just
        # did) does NOT trigger other workflows' `on: push` -- that's an
        # intentional anti-loop safeguard in Actions, but it means the
        # existing "Deploy to GitHub Pages" workflow would otherwise never
        # re-run for this commit, leaving the live site on stale data even
        # though it's current in the repo. Dispatch it explicitly instead.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run gh-pages.yml --repo ${{ github.repository }}
