name: Update Item Database Export

on:
  schedule:
    - cron: "17 6 * * *" # once daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    if: ${{ vars.ITEM_DB_API_BASE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync to the latest main
        # workflow_dispatch and schedule triggers pin the checkout to
        # whatever commit was the tip of main when the run was *queued*, not
        # when it *starts* -- and this workflow has been observed sitting
        # queued for over an hour under Actions congestion, by which point
        # unrelated commits had already landed on main. The later "reset
        # --soft" step used to only move the branch pointer forward while
        # leaving this stale checkout's tree in place, so committing just the
        # two export files still committed the *rest* of the stale tree with
        # them -- silently reverting every real commit that had landed while
        # this run sat queued. Doing a full hard reset here, before anything
        # is generated, means the working tree is never stale by the time
        # something gets committed.
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch export from the item database Worker
        env:
          API_BASE: ${{ vars.ITEM_DB_API_BASE }}
          EXPORT_TOKEN: ${{ secrets.ITEM_DB_EXPORT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p frontend/data
          curl -sf -H "Authorization: Bearer ${EXPORT_TOKEN}" "${API_BASE}/api/export" -o frontend/data/items.json
          jq 'if (.items | type) != "array" then error("malformed export: missing items array") else . end' frontend/data/items.json > /dev/null

      - name: Convert to CSV
        run: |
          set -euo pipefail
          jq -r '
            (["item_id","name","icon_id","confirmations","status","updated_at"] | @csv),
            (.items[] | [.item_id, .name, .icon_id, .confirmations, .status, .updated_at] | @csv)
          ' frontend/data/items.json > frontend/data/items.csv

      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/items.json frontend/data/items.csv
          if git diff --cached --quiet; then
            echo "No changes to the export."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update item database export"
            # Guard against another push landing on main between the sync
            # step above and this push: retry against the new tip rather
            # than risk writing a stale commit. Never force-push -- a real
            # conflict (someone else's commit also touching the export
            # files) should fail the job loudly, not overwrite their work.
            pushed=false
            for attempt in 1 2 3; do
              if git push; then
                pushed=true
                break
              fi
              git fetch origin main
              git rebase origin/main
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Could not push the export commit after 3 attempts" >&2
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        # A push made with the default GITHUB_TOKEN (as the step above just
        # did) does NOT trigger other workflows' `on: push` -- that's an
        # intentional anti-loop safeguard in Actions, but it means the
        # existing "Deploy to GitHub Pages" workflow would otherwise never
        # re-run for this commit, leaving the live site on stale data even
        # though it's current in the repo. Dispatch it explicitly instead.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run gh-pages.yml --repo ${{ github.repository }}
